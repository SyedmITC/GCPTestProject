apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops-lab-dev

resources:
- ../../base

labels:
- pairs:
    environment: dev

configMapGenerator:
- behavior: merge
  literals:
  - APP_ENV=dev
  name: app-config

images:
- name: backend
  newName: us-central1-docker.pkg.dev/gcptestproject-514715/gitops-lab/backend
  newTag: f678d79
- name: frontend
  newName: us-central1-docker.pkg.dev/gcptestproject-514715/gitops-lab/frontend
  newTag: ae81dea
